[workspace]
resolver = "3"
members = ["core", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["ecdevv <ech2447@gmail.com>"]
repository = "https://github.com/ecdevv/lumen"

[workspace.dependencies]
async-trait     = "0.1.89"
futures-util    = "0.3.32"
insta           = "1.41.0"
serde_json      = "1.0.149"
similar         = "2.6.0"
tempfile        = "3.13.0"
tokio           = "1.42.0"
tracing         = "0.1.44"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all       = { level = "warn", priority = -1 }
pedantic  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"   # noisy, fights ergonomics
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
doc_markdown            = "allow"   # backtick-quotes every brand name otherwise

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"